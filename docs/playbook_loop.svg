<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1010 486" width="1010" height="486" role="img" aria-labelledby="t d"><title id="t">Playbooks by step</title><desc id="d">A grid with one row per playbook and one column per step: research, plan, implement, check. A person reviews the plan. A dashed line between plan and implement marks the fresh session, and only plan.md crosses it. A failed check returns to implement. Each cell says what that playbook does at that step.</desc><style>
    .bg{fill:#ffffff}.hd{fill:#1f2937}.row0{fill:#f3f4f6}
    .hl{stroke:#e5e7eb;stroke-width:1}.vl{stroke:#e5e7eb;stroke-width:1}.frame{fill:none;stroke:#d1d5db;stroke-width:1}
    .hn{font:400 17px "Alata","Inter","Helvetica Neue",Arial,sans-serif;fill:#f3eee6}
    .hm{font:400 10.5px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#a59e92}
    .rl{font:400 10.5px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#111827}
    .rl0{font:400 13px "Alata","Inter","Helvetica Neue",Arial,sans-serif;fill:#000000}
    .c{font:400 11px "Inter","Helvetica Neue",Arial,sans-serif;fill:#222222}
    .c0{font:400 11px "Inter","Helvetica Neue",Arial,sans-serif;fill:#111827}
    .ft{font:400 11px "Inter","Helvetica Neue",Arial,sans-serif;fill:#6b7280}
    .bnd{stroke:#3dbbd2;stroke-width:2;stroke-dasharray:6 5;fill:none}
    .bt{font:500 10.5px "JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;fill:#17707f}
    .badge{fill:#3dbbd2}.bdt{font:500 10.5px "Inter","Helvetica Neue",Arial,sans-serif;fill:#111827}
    .sig{font:400 13px "Alata","Inter","Helvetica Neue",Arial,sans-serif;fill:#000000}.acc{fill:#17707f}
    @media (prefers-color-scheme: dark){
      .bg{fill:#262421}.hd{fill:#1d1b19}.row0{fill:#302d29}
      .hl,.vl{stroke:#45413b}.frame{stroke:#45413b}
      .rl,.c0{fill:#e6e0d6}.rl0,.sig{fill:#f3eee6}.c{fill:#ddd6ca}.ft{fill:#a59e92}
      .bnd{stroke:#56c8dd}.bt{fill:#56c8dd}.badge{fill:#56c8dd}.bdt{fill:#262421}.acc{fill:#56c8dd}
    }
</style>
<rect class="bg" width="1010" height="486"/>
<rect class="hd" x="14" y="0" width="976" height="64"/>
<text class="hn" x="24" y="26">playbook</text><text class="hm" x="24" y="46">AGENTS.md read first · P5</text>
<text class="hn" x="200" y="26">Research</text><text class="hm" x="200" y="46">P1 P7 · sub-agents ok</text>
<text class="hn" x="390" y="26">Plan</text><text class="hm" x="390" y="46">P3</text>
<rect class="badge" x="482" y="12" width="78" height="20" rx="2"/><text class="bdt" x="521" y="26" text-anchor="middle">you review</text>
<text class="hn" x="620" y="26">Implement</text><text class="hm" x="620" y="46">P2 P6</text>
<text class="hn" x="810" y="26">Check</text><text class="hm" x="810" y="46">P4 · fail: redo step</text>
<rect class="row0" x="14" y="64" width="976" height="52"/>
<line class="hl" x1="14" y1="116" x2="990" y2="116"/>
<text class="rl0" x="24" y="94.0">default loop</text>
<text class="c0" x="200" y="86">read code, write research.md,</text><text class="c0" x="200" y="102">no edits</text>
<text class="c0" x="390" y="86">plan.md: ordered steps, files,</text><text class="c0" x="390" y="102">scope, how each is checked</text>
<text class="c0" x="620" y="86">one step, test, commit;</text><text class="c0" x="620" y="102">stop if the plan doesn&#x27;t fit</text>
<text class="c0" x="810" y="86">summarize the diff vs the plan;</text><text class="c0" x="810" y="102">list anything unplanned</text>
<line class="hl" x1="14" y1="168" x2="990" y2="168"/>
<text class="rl" x="24" y="146.0">refactoring</text>
<text class="c" x="200" y="138">pin behavior first with</text><text class="c" x="200" y="154">characterization tests, then read</text>
<text class="c" x="390" y="138">behavior-preserving steps;</text><text class="c" x="390" y="154">explicit out-of-scope list</text>
<text class="c" x="620" y="138">no test-file edits;</text><text class="c" x="620" y="154">tests pass after every step</text>
<text class="c" x="810" y="138">diff on test paths is empty;</text><text class="c" x="810" y="154">public interfaces unchanged</text>
<line class="hl" x1="14" y1="220" x2="990" y2="220"/>
<text class="rl" x="24" y="198.0">test_backfill</text>
<text class="c" x="200" y="190">list behaviors to protect,</text><text class="c" x="200" y="206">ranked by risk, not functions</text>
<text class="c" x="390" y="190">pick behaviors to test</text><text class="c" x="390" y="206">in this pass</text>
<text class="c" x="620" y="190">tests only, no production code;</text><text class="c" x="620" y="206">bugs go to notes.md</text>
<text class="c" x="810" y="190">state what each test asserts;</text><text class="c" x="810" y="206">break the code, see it fail</text>
<line class="hl" x1="14" y1="272" x2="990" y2="272"/>
<text class="rl" x="24" y="250.0">codebase_onboarding</text>
<text class="c" x="200" y="242">explore (sub-agents on big</text><text class="c" x="200" y="258">repos): layout, commands, rules</text>
<text class="c" x="390" y="242">draft AGENTS.md; a person adds</text><text class="c" x="390" y="258">the unwritten rules</text>
<text class="c" x="620" y="242">run every command listed;</text><text class="c" x="620" y="258">fix the ones that fail</text>
<text class="c" x="810" y="242">fresh session builds and tests</text><text class="c" x="810" y="258">from AGENTS.md alone</text>
<line class="hl" x1="14" y1="324" x2="990" y2="324"/>
<text class="rl" x="24" y="302.0">legacy_redevelopment</text>
<text class="c" x="200" y="294">map the system: entry points,</text><text class="c" x="200" y="310">data flows, odd behavior</text>
<text class="c" x="390" y="294">pick a seam and one slice;</text><text class="c" x="390" y="310">the old path stays</text>
<text class="c" x="620" y="294">build the new path beside the</text><text class="c" x="620" y="310">old, one step at a time</text>
<text class="c" x="810" y="294">compare old and new outputs;</text><text class="c" x="810" y="310">update the map, next slice</text>
<line class="hl" x1="14" y1="376" x2="990" y2="376"/>
<text class="rl" x="24" y="354.0">dependency_migration</text>
<text class="c" x="200" y="346">read the changelog; list breaking</text><text class="c" x="200" y="362">changes with file references</text>
<text class="c" x="390" y="346">order the changes; one jump or</text><text class="c" x="390" y="362">stepwise; no other dependencies</text>
<text class="c" x="620" y="346">fix warnings, don&#x27;t silence;</text><text class="c" x="620" y="362">build and tests every step</text>
<text class="c" x="810" y="346">list re-pinned dependencies,</text><text class="c" x="810" y="362">read the lockfile diff</text>
<line class="hl" x1="14" y1="428" x2="990" y2="428"/>
<text class="rl" x="24" y="406.0">clean_room_implementation</text>
<text class="c" x="200" y="398">spec session: write spec.md</text><text class="c" x="200" y="414">from public behavior only</text>
<text class="c" x="390" y="398">a person strips internals from</text><text class="c" x="390" y="414">spec.md; only the spec moves on</text>
<text class="c" x="620" y="398">fresh session sees spec.md only;</text><text class="c" x="620" y="414">plan, review, build</text>
<text class="c" x="810" y="398">tests written from the spec;</text><text class="c" x="810" y="414">provenance.md lists the inputs</text>
<line class="vl" x1="190" y1="64" x2="190" y2="428"/>
<line class="vl" x1="380" y1="64" x2="380" y2="428"/>
<line class="vl" x1="610" y1="64" x2="610" y2="428"/>
<line class="vl" x1="800" y1="64" x2="800" y2="428"/>
<rect class="frame" x="14" y="0" width="976" height="428"/>
<line class="bnd" x1="590" y1="0" x2="590" y2="124.0"/><line class="bnd" x1="590" y1="368.0" x2="590" y2="428"/>
<text class="bt" x="590" y="246.0" text-anchor="middle" transform="rotate(-90 590 246.0)" dy="4">fresh session · only plan.md crosses</text>
<text class="ft" x="14" y="454">P1 context is finite · P2 fresh context per phase · P3 review where it is cheapest · P4 let the agent check itself</text>
<text class="ft" x="14" y="472">P5 write down what it can't know · P6 small, reversible steps · P7 isolate noisy work</text>
</svg>