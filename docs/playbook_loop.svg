<line class="bnd" x1="556" y1="398" x2="582" y2="398"/>
<text class="lbl" x="590" y="402">fresh session starts</text>
<rect class="pill" x="714" y="392" width="26" height="12" rx="2"/>
<text class="lbl" x="748" y="402">what one playbook changes</text>
